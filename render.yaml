services:
  - type: web
    name: aura-voice-cx
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/health
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: GROQ_API_KEY
        sync: false
